org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Termux/aarch64: Google ships only x86-64 AAPT2, so it runs via QEMU.
# Kept in sync with ~/.gradle/gradle.properties (both are required here).
android.aapt2FromMavenOverride=/data/data/com.termux/files/home/.local/aapt2-qemu/aapt2
